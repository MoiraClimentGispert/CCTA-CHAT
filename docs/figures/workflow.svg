<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">CCTA-CHAT workflow</title><desc id="desc">Four stages: CCTA study, instruction preparation, model adaptation, and evaluation. The clinical cohort has eight training scans and two held-out scans.</desc><rect width="720" height="430" rx="18" fill="#f7fafc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5c7286" stroke-width="1.5"/></marker></defs><rect x="24" y="24" width="314" height="170" rx="14" fill="#e9f1f8" stroke="#cbd5df" stroke-width="1.5"/><text x="44" y="59" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#59738b" text-anchor="start">01</text><text x="44" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#23384c" text-anchor="start">CCTA study</text><text x="44" y="136" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#23384c" text-anchor="start">8 training scans</text><text x="44" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#23384c" text-anchor="start">2 held-out scans</text><rect x="382" y="24" width="314" height="170" rx="14" fill="#e8f3ef" stroke="#cbd5df" stroke-width="1.5"/><text x="402" y="59" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#59738b" text-anchor="start">02</text><text x="402" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#23384c" text-anchor="start">Instruction data</text><text x="402" y="136" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#23384c" text-anchor="start">Clinical tasks</text><text x="402" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#23384c" text-anchor="start">Literature QA</text><rect x="24" y="238" width="314" height="170" rx="14" fill="#f4edf8" stroke="#cbd5df" stroke-width="1.5"/><text x="44" y="273" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#59738b" text-anchor="start">03</text><text x="44" y="314" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#23384c" text-anchor="start">Model adaptation</text><text x="44" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#23384c" text-anchor="start">CT-ViT features</text><text x="44" y="379" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#23384c" text-anchor="start">Projector + LoRA</text><rect x="382" y="238" width="314" height="170" rx="14" fill="#fcf1df" stroke="#cbd5df" stroke-width="1.5"/><text x="402" y="273" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#59738b" text-anchor="start">04</text><text x="402" y="314" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#23384c" text-anchor="start">Evaluation</text><text x="402" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#23384c" text-anchor="start">Language + alignment</text><text x="402" y="379" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#23384c" text-anchor="start">Specialist review</text><path d="M345 109 L374 109" stroke="#5c7286" stroke-width="2" marker-end="url(#arrow)"/><path d="M346 323 L374 323" stroke="#5c7286" stroke-width="2" marker-end="url(#arrow)"/><path d="M539 205 L539 220 L181 220 L181 230" fill="none" stroke="#5c7286" stroke-width="2" marker-end="url(#arrow)"/></svg>