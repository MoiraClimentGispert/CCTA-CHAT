<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="title desc"><title id="title">Intended FT1 and FT2 adaptation strategies</title><desc id="desc">Both strategies use cached CT-ViT features and train the projector. FT1 creates a fresh CAD adapter over a merged CT-CHAT base. FT2 continues the original pretrained CT-CHAT adapter.</desc><rect width="720" height="590" rx="18" fill="#f7fafc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5c7286" stroke-width="1.5"/></marker></defs><text x="28" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#23384c" text-anchor="start">Intended adaptation strategies</text><rect x="24" y="68" width="672" height="208" rx="14" fill="#eef0fa" stroke="#cbd5df" stroke-width="1.5"/><text x="46" y="103" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#23384c" text-anchor="start">FT1 · Fresh CAD adapter</text><rect x="46" y="120" width="286" height="100" rx="14" fill="#ffffff" stroke="#cbd5df" stroke-width="1.5"/><text x="62" y="150" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#23384c" text-anchor="start">LLaMA + CT-CHAT</text><text x="62" y="181" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#23384c" text-anchor="start">adapter merged</text><rect x="374" y="120" width="298" height="100" rx="14" fill="#e1f1ec" stroke="#cbd5df" stroke-width="1.5"/><text x="392" y="150" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#23384c" text-anchor="start">New CAD LoRA</text><text x="392" y="181" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#23384c" text-anchor="start">trainable</text><path d="M342 167 L364 167" stroke="#5c7286" stroke-width="2" marker-end="url(#arrow)"/><text x="46" y="251" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#23384c" text-anchor="start">Frozen merged base · train fresh CAD LoRA</text><rect x="24" y="294" width="672" height="208" rx="14" fill="#eef0fa" stroke="#cbd5df" stroke-width="1.5"/><text x="46" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#23384c" text-anchor="start">FT2 · Continue existing adapter</text><rect x="46" y="346" width="286" height="100" rx="14" fill="#ffffff" stroke="#cbd5df" stroke-width="1.5"/><text x="62" y="376" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#23384c" text-anchor="start">LLaMA base</text><text x="62" y="407" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#23384c" text-anchor="start">frozen</text><rect x="374" y="346" width="298" height="100" rx="14" fill="#e1f1ec" stroke="#cbd5df" stroke-width="1.5"/><text x="392" y="376" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#23384c" text-anchor="start">CT-CHAT LoRA</text><text x="392" y="407" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#23384c" text-anchor="start">continue training</text><path d="M342 393 L364 393" stroke="#5c7286" stroke-width="2" marker-end="url(#arrow)"/><text x="46" y="477" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#23384c" text-anchor="start">Keep pretrained adapter · update its weights</text><text x="36" y="540" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#23384c" text-anchor="start">Both: cached CT-ViT → trainable projector → LLaMA</text><text x="36" y="570" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#23384c" text-anchor="start">The image encoder runs offline.</text></svg>